name: Build & Deploy → ZeroServer

on:
  push:
    branches: [main, develop]

# ─────────────────────────────────────────────────────────────────────────────
# Secrets necessários no GitHub (Settings → Secrets → Actions):
#
#   VITE_SUPABASE_URL        URL do Supabase (prod ou dev conforme branch)
#   VITE_SUPABASE_ANON_KEY   Anon key do Supabase
#   ZS_TOKEN                 Token do ZeroServer (conta de produção)
#   ZS_TOKEN_DEV             Token do ZeroServer (conta/ambiente de dev)
#   SUPABASE_SERVICE_ROLE_KEY  Service role do Supabase (backend)
#   GEMINI_API_KEY             Chave da API do Gemini
#   STORAGE_ENCRYPTION_KEY     AES-256 dos PDFs no Storage (64 hex) — OBRIGATÓRIO
#   DB_ENCRYPTION_KEY          AES-256 dos campos PII no banco (64 hex) — OBRIGATÓRIO
#   SEARCH_HMAC_KEY            HMAC dos blind indexes (64 hex) — OBRIGATÓRIO
#   SUPERADMIN_EMAIL           E-mail do superadmin inicial (opcional)
#   SUPERADMIN_INITIAL_PASSWORD  Senha inicial do superadmin, ≥ 12 caracteres (opcional)
#
#   ⚠️ As chaves de criptografia são permanentes: perdê-las torna os dados cifrados
#   irrecuperáveis. Guarde uma cópia fora do GitHub (gerenciador de senhas).
#
# Nota: VITE_BACKEND_URL não é um secret — em produção é string vazia.
# O Nginx faz proxy de /api/* e /admin/* para o backend internamente.
# ─────────────────────────────────────────────────────────────────────────────

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/seguronamao-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/seguronamao-frontend

jobs:
  build-and-deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # necessário para push no GHCR

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout do repositório
        uses: actions/checkout@v4

      # ── 2. Login no GitHub Container Registry ────────────────────────────────
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      # ── 3. Definir tag e variáveis por ambiente ─────────────────────────────────
      - name: Definir variáveis de ambiente
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "TAG=latest"                        >> $GITHUB_ENV
            echo "VITE_BACKEND_URL="                  >> $GITHUB_ENV
            echo "ZS_TOKEN=${{ secrets.ZS_TOKEN }}"  >> $GITHUB_ENV
          else
            echo "TAG=develop"                        >> $GITHUB_ENV
            # No ZeroServer, Nginx faz o proxy reverso em qualquer ambiente
            echo "VITE_BACKEND_URL="                  >> $GITHUB_ENV
            echo "ZS_TOKEN=${{ secrets.ZS_TOKEN_DEV || secrets.ZS_TOKEN }}" >> $GITHUB_ENV
          fi
          # SHA curto para tag imutável (facilita rollback)
          echo "SHA_TAG=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      # ── 4. Build & Push: Backend ─────────────────────────────────────────────
      - name: Build & Push imagem do backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: production
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ env.TAG }}
            ${{ env.BACKEND_IMAGE }}:${{ env.SHA_TAG }}
            ${{ env.BACKEND_IMAGE }}:latest

      # ── 5. Build & Push: Frontend ────────────────────────────────────────────
      # As variáveis VITE_* são build-args: ficam embutidas no bundle JS pelo Vite
      - name: Build & Push imagem do frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          target: production
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.TAG }}
            ${{ env.FRONTEND_IMAGE }}:${{ env.SHA_TAG }}
            ${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL || 'https://qmmshawbcwmvqtxjtkxy.supabase.co' }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtbXNoYXdiY3dtdnF0eGp0a3h5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2MzQxNjUsImV4cCI6MjA5NTIxMDE2NX0._pbPf5lP2UjLVI8CaY9Lov7AEfK3yJY9aLBx1LPaFSs' }}
            VITE_BACKEND_URL=${{ env.VITE_BACKEND_URL }}

      # ── 6. Instalar CLI do ZeroServer ────────────────────────────────────────
      - name: Instalar zs CLI
        run: curl -fsSL https://raw.githubusercontent.com/zeroserver-cc/zsc-cli/main/install.sh | sh

      # ── 7. Deploy no ZeroServer ──────────────────────────────────────────────
      # O CLI lê o zs.yaml na raiz do repositório.
      - name: Deploy no ZeroServer
        env:
          ZS_TOKEN: ${{ env.ZS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPERADMIN_EMAIL: ${{ secrets.SUPERADMIN_EMAIL }}
          SUPERADMIN_INITIAL_PASSWORD: ${{ secrets.SUPERADMIN_INITIAL_PASSWORD }}
          # Chaves de criptografia LGPD (ADR-007) — obrigatórias
          STORAGE_ENCRYPTION_KEY: ${{ secrets.STORAGE_ENCRYPTION_KEY }}
          DB_ENCRYPTION_KEY: ${{ secrets.DB_ENCRYPTION_KEY }}
          SEARCH_HMAC_KEY: ${{ secrets.SEARCH_HMAC_KEY }}
        run: |
          # Atualizar tags das imagens para a branch atual (latest ou develop)
          sed -i "s|${{ env.BACKEND_IMAGE }}:latest|${{ env.BACKEND_IMAGE }}:${{ env.TAG }}|g" zs.yaml
          sed -i "s|${{ env.FRONTEND_IMAGE }}:latest|${{ env.FRONTEND_IMAGE }}:${{ env.TAG }}|g" zs.yaml

          # Sem as chaves de criptografia o backend gravaria PII em texto claro: aborta o deploy.
          for VAR in STORAGE_ENCRYPTION_KEY DB_ENCRYPTION_KEY SEARCH_HMAC_KEY; do
            if [ -z "${!VAR}" ]; then
              echo "::error::Secret $VAR não configurado no GitHub (obrigatório pela ADR-007)."
              exit 1
            fi
          done

          # Injeta no zs.yaml os secrets existentes. A substituição é literal (via Python),
          # então valores com |, & ou / não quebram o arquivo como ocorreria com sed.
          for VAR in SUPABASE_SERVICE_ROLE_KEY GEMINI_API_KEY SUPERADMIN_EMAIL SUPERADMIN_INITIAL_PASSWORD \
                     STORAGE_ENCRYPTION_KEY DB_ENCRYPTION_KEY SEARCH_HMAC_KEY; do
            if [ -n "${!VAR}" ]; then
              python3 -c 'import os, sys; n = sys.argv[1]; s = open("zs.yaml").read(); open("zs.yaml", "w").write(s.replace(n + "=__SUBSTITUIR__", n + "=" + os.environ[n]))' "$VAR"
            fi
          done

          # Remove variáveis não preenchidas, para que o placeholder nunca chegue ao container
          # como valor real (ex.: SUPERADMIN_EMAIL="__SUBSTITUIR__").
          sed -i '/=__SUBSTITUIR__$/d' zs.yaml

          # Autenticar no ZeroServer via token/API key
          if [ -z "$ZS_TOKEN" ]; then
            echo "::error::ZS_TOKEN ou ZS_TOKEN_DEV não foi encontrado nos Secrets do GitHub!"
            exit 1
          fi

          if [[ "$ZS_TOKEN" == zsk_* ]]; then
            echo "$ZS_TOKEN" | zs login --api-key --token-stdin
          else
            zs login --token "$ZS_TOKEN"
          fi
          
          zs deploy

      # ── 8. Verificação pós-deploy ────────────────────────────────────────────
      - name: Listar apps e confirmar status RUNNING
        env:
          ZS_TOKEN: ${{ env.ZS_TOKEN }}
        run: |
          echo "Aguardando inicialização..."
          sleep 15
          zs list
          echo "### ZeroServer Deploy Status 🚀" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          zs list >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
