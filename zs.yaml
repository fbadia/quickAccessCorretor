# ─────────────────────────────────────────────────────────────────────────────
# zs.yaml — Orquestrador ZeroServer Community Cloud
# Lido pelo CLI `zs deploy` para subir a aplicação SeguroNaMão.
# Referência oficial: https://github.com/zeroserver-cc/demo-apps/blob/main/docs/zs-yaml-reference.md
#
# IMPORTANTE: Nunca coloque credenciais reais neste arquivo.
# Configure as variáveis sensíveis pelo portal do ZeroServer.
# ─────────────────────────────────────────────────────────────────────────────

app: seguronamao

# Preferência geográfica: nós brasileiros (LGPD + menor latência)
placement:
  country: br

services:
  # ── Backend: Node.js + Express ──────────────────────────────────────────────
  - name: backend
    image: ghcr.io/fbadia/seguronamao-backend:latest
    # ports não declarados — backend é interno, não recebe tráfego externo.
    # Serviços da mesma app se enxergam por nome: http://backend:3001
    env:
      # Supabase — preencher via portal ZeroServer, não aqui
      - SUPABASE_URL=__SUBSTITUIR__
      - SUPABASE_SERVICE_ROLE_KEY=__SUBSTITUIR__
      # Google Gemini AI
      - GEMINI_API_KEY=__SUBSTITUIR__
      # Google Drive (opcional — remover se não usar sync via Drive)
      - GOOGLE_DRIVE_FOLDER_ID=__SUBSTITUIR__
      - GOOGLE_SERVICE_ACCOUNT_JSON=__SUBSTITUIR__
      # Servidor
      - PORT=3001
      - NODE_ENV=production

  # ── Frontend: Nginx (serve SPA + proxy reverso para o backend) ────────────
  - name: frontend
    image: ghcr.io/fbadia/seguronamao-frontend:latest
    ports: ["80"]
    dependsOn: [backend]
    # ┌─ Único ponto de entrada externo (exposed: true = URL pública HTTPS) ──
    # │ Browser → /api/*, /admin/*, /superadmin/*, /health
    # │         → Nginx proxy → backend:3001 (rede interna)
    # │ Browser → /* → Nginx serve index.html (React SPA)
    # └───────────────────────────────────────────────────────────────────────
    exposed: true
