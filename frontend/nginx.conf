server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compressão gzip para reduzir tamanho das respostas
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # Fallback SPA: qualquer rota não-arquivo serve o index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache imutável para assets com hash no nome (gerados pelo Vite)
    # Ex: /assets/index-Bk3f9aQe.js → pode ser cacheado por 1 ano
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Sem cache para o index.html (sempre busca a versão mais recente)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
