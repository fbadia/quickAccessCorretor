server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compressão gzip para reduzir tamanho das respostas
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ── Proxy reverso para o backend ─────────────────────────────────────────
    # O backend tem rotas sob /api/, /admin/, /superadmin/ e /health.
    # Todas são repassadas internamente ao container "backend" via rede do ZeroServer.
    # O browser enxerga tudo na mesma URL pública — sem precisar saber o IP do backend.
    location ~ ^/(api|admin|superadmin|health)(/|$) {
        proxy_pass         http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Suporte a uploads de PDF (sem timeout curto)
        proxy_read_timeout    300s;
        proxy_connect_timeout 60s;

        # Tamanho máximo de upload (apólices em PDF)
        client_max_body_size  50M;
    }

    # ── Fallback SPA ─────────────────────────────────────────────────────────
    # Qualquer rota não-arquivo serve o index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache imutável para assets com hash no nome (gerados pelo Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Sem cache para o index.html (sempre busca a versão mais recente)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

